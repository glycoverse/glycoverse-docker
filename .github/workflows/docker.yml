name: Docker

on:
  schedule:
    - cron: '17 2 1 * *' # First of each month at 10:17 in Shanghai
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this month's tested images to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.publish) && 'release' || 'check' }}
  cancel-in-progress: false

env:
  IMAGE: fubin1999/glycoverse
  R_VERSION: 4.6.2

jobs:
  keep-schedule-active:
    name: Keep the monthly schedule active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # GitHub disables schedules after 60 days of inactivity in public repos.
      - run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # A retried job can reuse the other architecture from the same run.
      ARCH_TAG: build-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check publishing configuration
        if: &publish ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Set the DOCKERHUB_USERNAME repository variable."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set the DOCKERHUB_TOKEN repository secret."; exit 1; }
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.ARCH_TAG }}
          no-cache: *publish
          cache-from: type=gha,scope=glycoverse-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=glycoverse-${{ matrix.arch }}
      - name: Test the runtime without network access
        run: |
          docker run --rm --network none \
            "$IMAGE:$ARCH_TAG" \
            Rscript /opt/glycoverse/smoke-test.R
      - name: Collect installed package versions
        run: |
          mkdir -p build
          docker run --rm --network none \
            "$IMAGE:$ARCH_TAG" \
            cat /opt/glycoverse/package-versions.tsv > build/package-versions.tsv
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-versions-${{ matrix.arch }}
          path: build/package-versions.tsv
          overwrite: true
      - name: Log in to Docker Hub
        if: *publish
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested architecture
        if: *publish
        run: docker push "$IMAGE:$ARCH_TAG"

  publish:
    name: Publish multi-platform tags
    needs: build
    if: *publish
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only after both architectures pass
        run: |
          month=$(date -u +%Y-%m)
          docker buildx imagetools create \
            --tag "$IMAGE:$month" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:4.6" \
            --tag "$IMAGE:$R_VERSION" \
            --tag "$IMAGE:$R_VERSION-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$IMAGE:build-${GITHUB_RUN_ID}-amd64" \
            "$IMAGE:build-${GITHUB_RUN_ID}-arm64"
          docker buildx imagetools inspect "$IMAGE:$month"
